[project]
name = "glacis"
version = "0.2.0"
description = "GLACIS — Conservative, passive, human-controlled pentesting and lab field worksheet"
readme = "README.md"
authors = [
    { name = "GLACIS Contributors" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "textual>=0.70.0",
]

[project.scripts]
glacis = "glacis.cli:main"
gls = "glacis.cli:main"
cyb0x-s = "glacis.cli:main"
cys = "glacis.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "Pillow>=10.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-n auto --dist load"
markers = [
    "tui: Interactive Textual UI tests (full app lifecycle and pilot simulations)",
    "fast: Fast unit, database, CLI, and model tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

